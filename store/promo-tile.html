<!doctype html><meta charset="utf-8">
<style>
html,body{margin:0}
body{width:440px;height:280px;overflow:hidden;background:#FBF9FE;font-family:-apple-system,"Hiragino Sans",sans-serif;color:#4A4A4A;position:relative}
.card{position:absolute;width:150px;height:196px;border-radius:16px;background:#fff;box-shadow:0 1px 1px rgba(110,80,150,.05),0 8px 24px rgba(110,80,150,.1),0 24px 50px rgba(110,80,150,.12)}
.c1{left:286px;top:52px;transform:rotate(-6deg)}
.c2{left:290px;top:42px;transform:rotate(9deg) translateX(40px)}
.stamp{position:absolute;left:14px;top:18px;width:62px;height:62px;border-radius:50%;border:2.5px solid #3FC6DA;display:grid;place-items:center;font-size:32px;background:rgba(255,255,255,.9);transform:rotate(-12deg)}
.stamp::before{content:"";position:absolute;inset:3px;border-radius:50%;border:1.2px solid #3FC6DA}
.l{position:absolute;left:18px;height:8px;border-radius:4px}
h1{position:absolute;left:30px;top:84px;margin:0;font-size:27px;letter-spacing:-.01em;font-weight:800}
p{position:absolute;left:31px;top:124px;margin:0;font-size:14px;color:#8C8C8C;line-height:1.5}
.ic{position:absolute;left:28px;top:32px;width:44px;height:44px}
.dots{position:absolute;left:31px;top:196px;display:flex;gap:10px;font-size:22px}
</style>
<img class="ic" src="../icons/src/icon.svg">
<h1>Bookmark Swipe</h1>
<p>Sort your X bookmarks<br>one swipe at a time.</p>
<div class="dots"><span>👋</span><span>🤝</span><span>📁</span><span>⏳</span></div>

<div class="card c2"><div class="stamp">🤝</div><div class="l" style="top:110px;width:100px;background:#D6B3FC"></div><div class="l" style="top:128px;width:76px;background:#84F0FC"></div><div class="l" style="top:146px;width:60px;background:#FDB9E5"></div></div>
